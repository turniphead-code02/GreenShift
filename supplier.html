<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GreenShift | Supplier Scope 3 Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body><main style="max-width:820px;margin:3rem auto;padding:1rem">
<div class="card"><h1>Supplier Scope 3 Portal</h1>
<p>Nhà cung cấp nhập số liệu đơn giản. GreenShift lưu bản khảo sát để doanh nghiệp đối soát và đưa vào Scope 3 Cat.1.</p>
<div id="tokenBox" class="gs-warning" style="display:none"></div>
<form id="supplierForm">
<div class="form-group"><label>Tên nhà cung cấp *</label><input id="supplierName" class="form-control" required></div>
<div class="grid-3">
<div class="form-group"><label>Điện (kWh/năm)</label><input id="electricity" type="number" min="0" class="form-control"></div>
<div class="form-group"><label>Nhiên liệu (lít/kg/m³)</label><input id="fuel" type="number" min="0" class="form-control"></div>
<div class="form-group"><label>Sản lượng (tấn/năm)</label><input id="production" type="number" min="0" class="form-control"></div>
</div>
<div class="grid-3">
<div class="form-group"><label>EF điện (kgCO₂e/kWh)</label><input id="efElectricity" type="number" value="0.6766" step="any" class="form-control"></div>
<div class="form-group"><label>EF nhiên liệu (kgCO₂e/đơn vị)</label><input id="efFuel" type="number" step="any" class="form-control"></div>
<div class="form-group"><label>Priority</label><select id="priority" class="form-control"><option>Priority 1</option><option>Priority 2</option><option>Priority 3</option></select></div>
</div>
<button class="btn btn-primary" type="submit">Gửi dữ liệu</button> <a href="index.html" class="btn btn-outline">Trang chủ</a>
</form><div id="result" style="margin-top:1rem"></div></div></main>
<script>
const token=new URLSearchParams(location.search).get('token')||'public-survey';
document.getElementById('tokenBox').style.display=token==='public-survey'?'block':'none';
document.getElementById('tokenBox').textContent='⚠️ Đây là form khảo sát công khai mẫu. Doanh nghiệp nên tạo token riêng trước khi gửi cho nhà cung cấp.';
document.getElementById('supplierForm').addEventListener('submit',async e=>{
e.preventDefault(); const el=id=>document.getElementById(id).value;
const payload={companyName:el('supplierName'),electricity:Number(el('electricity')),fuel:Number(el('fuel')),production:Number(el('production')),efElectricity:Number(el('efElectricity')),efFuel:Number(el('efFuel')),priority:el('priority')};
payload.estimatedEmissions=((payload.electricity*payload.efElectricity)+(payload.fuel*payload.efFuel))/1000;
const r=await fetch('/api/save-supplier',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,supplier:payload})});
const d=await r.json(); document.getElementById('result').innerHTML=r.ok?'<div class="gs-success">✅ Đã gửi dữ liệu. Ước tính: '+payload.estimatedEmissions.toFixed(3)+' tCO₂e.</div>':'<div class="gs-warning">❌ '+(d.message||'Lỗi')+'</div>';
});
</script>  <script src="js/page-transition.js"></script>
</body></html>
